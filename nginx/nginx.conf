# Защиты:
#   CWE-319 (cleartext transmission) - весь трафик по TLS.
#   CWE-327/326 (слабые шифры) - только TLS 1.2+ и HIGH:!aNULL:!MD5.
#   CWE-1021/Clickjacking - X-Frame-Options: DENY.
#   CWE-693 - HSTS.

worker_processes auto;
events { worker_connections 1024; }

http {
    # Скрываем версию nginx
    server_tokens off;

    # Логи
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # HTTPS-сервер
    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        # Только TLS 1.2+ и сильные шифры -> CWE-327/326
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Ограничение размера запроса - защита от DoS
        client_max_body_size 16m;

        # Заголовки безопасности
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options    "nosniff"          always;
        add_header X-Frame-Options           "DENY"             always;
        add_header Referrer-Policy           "no-referrer"      always;

        location / {
            proxy_pass         http://api:5000;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }
    }

    # редирект HTTP на HTTPS
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }
}