# Защиты:
#   CWE-319 (cleartext transmission) - весь трафик по TLS.
#   CWE-327/326 (слабые шифры) - только TLS 1.2+ и HIGH:!aNULL:!MD5.
#   CWE-430 (MIME sniffing) - X-Content-Type-Options: nosniff
#   CWE-693 - HSTS: браузер год не будет ходить по HTTP - только по HTTPS.
#   CWE-1021/Clickjacking - X-Frame-Options: DENY.


worker_processes auto;              # число ядер CPU
events { worker_connections 1024; } # до 1024 соединений на воркер

http {
    # Скрытие версии nginx
    server_tokens off;

    # Логи
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # HTTPS-сервер
    server {
        listen 443 ssl;
        server_name nginx;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;  # Только TLS 1.2+ и сильные шифры -> CWE-327/326
        ssl_ciphers         HIGH:!aNULL:!MD5; # исключаются анонимные шифры и шифры с MD5
        ssl_prefer_server_ciphers on;         # сервер выбирает шифр из списка клиента

        # Ограничение размера запроса - защита от DoS
        client_max_body_size 16m;


        # Заголовки безопасности

        # HSTS: браузер запомнит, что год нельзя ходить по HTTP на сервер - только по HTTPS
        # 
        # SSL Stripping: 
        # 1. Пользователь набирает bank.com в адресной строке (без https://),
        # 2. Браузер по умолчанию сначала идёт по HTTP на порт 80.
        # 3. Атакующий в той же сети перехватывает HTTP-запрос.
        # 4. Атакующий притворяется сервером банка и браузер вместо редиректа на HTTPS общается с ним по HTTP.
        # 5. Пользователь видит "сайт банка", но весь трафик идёт открытым текстом через атакующего.
        add_header Strict-Transport-Security "max-age=31536000" always; 

        # браузер не угадывает MIME-тип
        # (сервер указывает в сообщении MIME-тип в заголовке Content-Type, но старые браузеры могли по содержимому 
        # сообщения отобразить его в другом формате, отличном от указанного в Content-Type - например, если браузер
        # увидит <script> в файле, то, несмотря Content-Type: text/plain, отобразит его как HTML -> <script> отработает)
        add_header X-Content-Type-Options    "nosniff"          always; 

        # страницу нельзя встроить в iframe 
        # (clickjacking - злоумышленник встраивает сайт в невидимый iframe на своей странице и 
        # заставляет пользователя кликать "не туда")
        add_header X-Frame-Options           "DENY"             always;

        # не передавать URL в заголовке Referer на другие сайты
        add_header Referrer-Policy           "no-referrer"      always;


        location / {
            proxy_pass         http://api:5000;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;

            # реальный IP клиента для фиксации rate limit
            proxy_set_header   X-Real-IP         $remote_addr; 
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;

            # приложение знает, что снаружи был HTTPS
            proxy_set_header   X-Forwarded-Proto $scheme;

            proxy_read_timeout 60s;
        }
    }

    # редирект HTTP на HTTPS
    server {
        listen 80;
        server_name nginx;
        return 301 https://$host$request_uri;
    }
}