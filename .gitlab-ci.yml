stages:
  - build

workflow:
  rules:
    - if: $CI_COMMIT_TAG
      when: always
    - when: never

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  DOCKER_BUILDKIT: "1"

# Сборка API
build-api:
  stage: build
  image: docker:24-cli
  services:
    - docker:24-dind
  rules:
    - if: $CI_COMMIT_TAG
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker build -t "$CI_REGISTRY_IMAGE/api:$CI_COMMIT_TAG" -t "$CI_REGISTRY_IMAGE/api:latest" ./api
    - docker push "$CI_REGISTRY_IMAGE/api:$CI_COMMIT_TAG"
    - docker push "$CI_REGISTRY_IMAGE/api:latest"

# Сборка клиента
build-client:
  stage: build
  image: docker:24-cli
  services:
    - docker:24-dind
  rules:
    - if: $CI_COMMIT_TAG
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker build -t "$CI_REGISTRY_IMAGE/client:$CI_COMMIT_TAG" -t "$CI_REGISTRY_IMAGE/client:latest" ./client
    - docker push "$CI_REGISTRY_IMAGE/client:$CI_COMMIT_TAG"
    - docker push "$CI_REGISTRY_IMAGE/client:latest"

# Сборка Nginx (без сертификатов)
build-nginx:
  stage: build
  image: docker:24-cli
  services:
    - docker:24-dind
  rules:
    - if: $CI_COMMIT_TAG
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker build -t "$CI_REGISTRY_IMAGE/nginx:$CI_COMMIT_TAG" -t "$CI_REGISTRY_IMAGE/nginx:latest" ./nginx
    - docker push "$CI_REGISTRY_IMAGE/nginx:$CI_COMMIT_TAG"
    - docker push "$CI_REGISTRY_IMAGE/nginx:latest"